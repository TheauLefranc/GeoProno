# Included in every location of nginx.conf: nginx drops server-level add_header
# directives inside any location that declares its own add_header.
#
# CSP: the app only talks to itself; fonts come from Google Fonts.
# style-src keeps 'unsafe-inline' because React renders inline style attributes.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# No framing: blocks clickjacking on "Miser" or admin buttons.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Only honoured by browsers over HTTPS (geoprono.xyz); ignored on plain HTTP.
add_header Strict-Transport-Security "max-age=31536000" always;
