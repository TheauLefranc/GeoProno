# Portainer stack. Create it in Portainer > Stacks > Add stack > Repository
# (public repo: no authentication), compose path "deploy/portainer-stack.yml",
# then enable "GitOps updates" > Webhook with "Re-pull image": copy that webhook
# URL into the GitHub secret PORTAINER_WEBHOOK_URL. Fill the variables below
# under "Environment variables". Images are built by GitHub Actions and pushed
# to GHCR (.github/workflows/ci-cd.yml); set both packages to Public once.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: geoprono
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: geoprono
    volumes:
      - geoprono-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoprono"]
      interval: 10s
      retries: 10

  api:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/geoprono-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://geoprono:${POSTGRES_PASSWORD}@db:5432/geoprono
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ chars)}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Set to "false" only if the site is served over plain HTTP.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ghcr.io/${GHCR_OWNER}/geoprono-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # The ONLY port published on the host. db and api stay on the stack's private
    # network, so they never clash with other services on the server.
    # WEB_BIND=127.0.0.1 makes it reachable only through a reverse proxy on the same host.
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8087}:80"
    depends_on:
      - api

volumes:
  geoprono-db:
