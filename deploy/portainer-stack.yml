# Portainer stack. Create it in Portainer > Stacks > Add stack > Repository,
# compose path "deploy/portainer-stack.yml", then enable "GitOps updates" > Webhook
# with "Re-pull image and redeploy": copy that webhook URL into the GitHub secret
# PORTAINER_WEBHOOK_URL. Fill the variables below under "Environment variables".
# Images are built and pushed to GHCR by GitHub Actions (.github/workflows/ci-cd.yml).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: geoprono
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: geoprono
    volumes:
      - geoprono-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoprono"]
      interval: 10s
      retries: 10

  api:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/geoprono-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://geoprono:${POSTGRES_PASSWORD}@db:5432/geoprono
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ chars)}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Set to "false" only if the site is served over plain HTTP.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ghcr.io/${GHCR_OWNER}/geoprono-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  geoprono-db:
